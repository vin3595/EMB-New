# Fly.io app config for the backend. Deploy from inside backend/:
#   fly launch --no-deploy   (first time; picks app name / region)
#   fly secrets set MONGO_URL=... ANTHROPIC_API_KEY=... JWT_SECRET=... OCR_MODEL_ID=claude-sonnet-5 CORS_ORIGINS=https://<your-frontend-domain>
#   fly deploy

app = "easemybill-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
