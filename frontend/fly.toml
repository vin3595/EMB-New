# Fly.io app config for the frontend. Deploy from inside frontend/, AFTER the
# backend is deployed and you know its public URL:
#   fly launch --no-deploy
#   fly deploy --build-arg REACT_APP_BACKEND_URL=https://easemybill-backend.fly.dev

app = "easemybill-frontend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
